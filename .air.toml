root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "tmp/main.exe"
  cmd = "go build -o tmp/main.exe main.go"
  delay = 1000
  exclude_dir = [".git", "assets", "tmp", "vendor", "testdata", "uploads", "public", "docs", "logs", "scripts", "scratch"]
  exclude_file = ["*.log", ".env*"]
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = ["handler", "database", "middleware", "models", "utils"]
  include_ext = ["go"]
  include_file = ["main.go"]
  kill_delay = "1000ms"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
