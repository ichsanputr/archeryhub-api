root = "."
testdata_dir = "testdata"
tmp_dir = "tmp_build"

[build]
  args_bin = []
  entrypoint = [".\\tmp_build\\main.exe"]
  # bin = ".\\tmp_build\\main.exe" # deprecated in air v1.50+
  cmd = "go build -o .\\tmp_build\\main.exe ."
  exclude_dir = [
    "assets",
    "tmp_build",
    "vendor",
    "testdata",
    "media",
    "logs",
    "printout",
    "data",
    "docs",
    "mayar-docs-api",
    "tripay-docs",
    "scratch",
    "scripts",
    "migrations",
    ".cursor",
    ".git",
    ".github"
  ]
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
