host: localhost:8001
info:
  contact: {}
  description: |-
    This documentation is exclusively for the ArcheryHub Mobile Application.
    NOTE: This Swagger only contains endpoints relevant to mobile app workflows (Scoring, Events, and Auth).
  title: ArcheryHub Mobile API
  version: "1.0"
paths:
  /mobile/archer/cart:
    get:
      description: Returns the authenticated archer cart items
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mobile.MobileCartResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get archer cart
      tags:
      - Mobile - Archer
  /mobile/archer/cart/checkout:
    post:
      consumes:
      - application/json
      description: Creates orders and Tripay payment from authenticated archer cart
      parameters:
      - description: Checkout request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CheckoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mobile.MobileCheckoutResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Checkout archer cart
      tags:
      - Mobile - Archer
  /mobile/archer/events:
    get:
      description: Returns all events the authenticated archer has registered for
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mobile.MobileMyEventsResponse'
      security:
      - BearerAuth: []
      summary: List archer's registered events
      tags:
      - Mobile - Archer
  /mobile/archer/events/{id}/qr:
    get:
      description: Returns archer QR information and payment status for a specific
        event
      parameters:
      - description: Event UUID or slug
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mobile.MobileEventQRCodeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get archer event QR
      tags:
      - Mobile - Archer
  /mobile/archer/events/{id}/registration:
    get:
      description: Returns registration details including payment status and payment
        instructions
      parameters:
      - description: Event UUID or slug
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mobile.MobileMyRegistrationResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get archer's registration for an event
      tags:
      - Mobile - Archer
  /mobile/archer/orders:
    get:
      description: Returns authenticated archer order history with payment summary
      parameters:
      - description: Order status
        in: query
        name: status
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mobile.MobileArcherOrdersResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get archer order history
      tags:
      - Mobile - Archer
  /mobile/archer/participants/{participantId}/payment:
    post:
      consumes:
      - application/json
      description: Create Tripay payment transaction for archer registration in an
        event
      parameters:
      - description: Participant registration UUID
        in: path
        name: participantId
        required: true
        type: string
      - description: Payment method
        in: body
        name: request
        required: true
        schema:
          properties:
            method:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mobile.MobilePaymentTransactionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create participant payment
      tags:
      - Mobile - Archer
  /mobile/auth/login:
    post:
      consumes:
      - application/json
      description: Login for archers using email and password
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          properties:
            email:
              type: string
            password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mobile.MobileLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
      summary: Archer login
      tags:
      - Mobile - Authentication
  /mobile/auth/organization/login:
    post:
      consumes:
      - application/json
      description: Login for organizations using email and password
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          properties:
            email:
              type: string
            password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mobile.MobileLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
      summary: Organization login
      tags:
      - Mobile - Authentication
  /mobile/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new archer account
      parameters:
      - description: Registration info
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/mobile.MobileLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
      summary: Archer registration
      tags:
      - Mobile - Authentication
  /mobile/auth/scorekeeper/login:
    post:
      consumes:
      - application/json
      description: Login for scorekeepers using their unique code
      parameters:
      - description: Scorekeeper login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/mobile.MobileScorekeeperLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mobile.MobileLoginResponse'
        "400":
