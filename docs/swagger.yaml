paths:
  /events/{id}/results/elimination:
    get:
      description: Get the elimination match brackets and results for a specific category
      parameters:
      - description: Event Slug or UUID
        in: path
        name: id
        required: true
        type: string
      - description: Category UUID
        in: query
        name: category_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get Elimination Bracket
      tags:
      - Mobile - Results
  /events/{id}/results/qualification:
    get:
      description: Get complete leaderboard for a specific category, including end-by-end
        scores
      parameters:
      - description: Event Slug or UUID
        in: path
        name: id
        required: true
        type: string
      - description: Category UUID
        in: query
        name: category_id
        required: true
        type: string
      produces:
      - application/json
      responses:
