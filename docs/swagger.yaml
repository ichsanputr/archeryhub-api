host: localhost:8001
info:
  contact: {}
  description: |-
    This documentation is exclusively for the ArcheryHub Mobile Application.
    NOTE: This Swagger only contains endpoints relevant to mobile app workflows (Scoring, Events, and Auth).
  title: ArcheryHub Mobile API
  version: "1.0"
paths:
  /archer/cart:
    get:
      description: Returns the authenticated archer cart items
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mobile.MobileCartResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get archer cart
      tags:
      - Archer
  /archer/cart/checkout:
    post:
      consumes:
      - application/json
      description: Creates orders and Tripay payment from authenticated archer cart
      parameters:
      - description: Checkout request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CheckoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mobile.MobileCheckoutResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Checkout archer cart
      tags:
      - Archer
  /archer/events:
    get:
      description: Returns all events the authenticated archer has registered for
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mobile.MobileMyEventsResponse'
      security:
      - BearerAuth: []
      summary: List archer's registered events
      tags:
      - Archer
  /archer/events/{id}/detail:
    get:
      description: Returns event detail including authenticated archer registration
        status
      parameters:
      - description: Event UUID or slug
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get event detail for archer (protected)
      tags:
      - Archer
  /archer/events/{id}/qr:
    get:
      description: Returns archer QR information and payment status for a specific
        event
      parameters:
      - description: Event UUID or slug
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mobile.MobileEventQRCodeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get archer event QR
      tags:
      - Archer
  /archer/events/{id}/registration:
    get:
      description: Returns registration details including payment status and payment
        instructions
      parameters:
      - description: Event UUID or slug
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mobile.MobileMyRegistrationResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get archer's registration for an event
      tags:
      - Archer
  /archer/me:
    get:
      description: Get the authenticated archer profile for mobile pages
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mobile.MobileArcherProfileResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get mobile archer profile
      tags:
      - Archer
    put:
      consumes:
      - application/json
      description: Update the authenticated archer profile for mobile pages
      parameters:
      - description: Archer profile payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/mobile.MobileUpdateArcherProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mobile.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update mobile archer profile
      tags:
      - Archer
  /archer/orders:
    get:
      description: Returns authenticated archer order history with payment summary
      parameters:
      - description: Order status
        in: query
        name: status
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mobile.MobileArcherOrdersResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get archer order history
      tags:
      - Archer
  /archer/participants/{participantId}/payment:
    post:
      consumes:
      - application/json
      description: Create Tripay payment transaction for archer registration in an
        event
      parameters:
      - description: Participant registration UUID
        in: path
        name: participantId
        required: true
        type: string
      - description: Payment method
        in: body
        name: request
        required: true
        schema:
          properties:
            method:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mobile.MobilePaymentTransactionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create participant payment
      tags:
      - Archer
  /archer/payments/{reference}:
