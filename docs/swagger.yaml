            $ref: '#/definitions/models.PaymentTransaction'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/mobile.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get payment detail
      tags:
      - Archer
