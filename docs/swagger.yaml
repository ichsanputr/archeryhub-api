      - Mobile - Archer
    get:
      description: Get current list of items in the shopping cart for the authenticated
        archer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mobile.MobileCartResponse'
      security:
      - ApiKeyAuth: []
      summary: Get Cart
      tags:
      - Mobile - Archer
    post:
      consumes:
      - application/json
      description: Add a product with specific quantity and color to the shopping
        cart
      parameters:
      - description: Add to Cart Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.AddToCartRequest'
