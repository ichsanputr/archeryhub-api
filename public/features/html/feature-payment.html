<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 1000px; height: 1000px; background-color: #f8fafc;
            font-family: 'Outfit', sans-serif; overflow: hidden; position: relative;
            display: flex; flex-direction: column; padding: 60px;
            background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .app-container {
            width: 100%; height: 100%;
            background: white; border-radius: 40px; border: 12px solid #0f172a;
            position: relative; display: flex; flex-direction: column; overflow: hidden;
        }
        .status-bar { height: 44px; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; color: #0f172a; }
        .checkout-item { display: flex; justify-content: space-between; padding: 20px 0; border-bottom: 1px dashed #e2e8f0; }
        .success-overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 40px;}
        .success-card { background: white; width: 100%; border-radius: 32px; padding: 40px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="status-bar"><span>9:41</span><div style="display: flex; gap: 6px;"><div style="width: 18px; height: 10px; border: 1px solid #0f172a; border-radius: 2px;"></div></div></div>
        
        <div style="padding: 40px 30px;">
            <div style="font-weight: 950; font-size: 24px; color: #0f172a; margin-bottom: 40px;">Pembayaran Turnamen</div>
            <div class="checkout-item">
                <div>
                    <div style="font-weight: 950; font-size: 16px;">Biaya Pendaftaran</div>
                    <div style="font-size: 12px; color: #64748b; font-weight: 700;">Recurve Men Open</div>
                </div>
                <div style="font-weight: 950; font-size: 18px;">Rp 250.000</div>
            </div>
            <div class="checkout-item">
                <div>
                    <div style="font-weight: 950; font-size: 16px;">Biaya Layanan</div>
                    <div style="font-size: 12px; color: #64748b; font-weight: 700;">QRIS / VA Fee</div>
                </div>
                <div style="font-weight: 950; font-size: 18px;">Rp 2.500</div>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 30px 0;">
                <div style="font-weight: 950; font-size: 20px;">TOTAL</div>
                <div style="font-weight: 950; font-size: 24px; color: #ef4444;">Rp 252.500</div>
            </div>
        </div>

        <div class="success-overlay">
            <div class="success-card">
                <div style="width: 80px; height: 80px; background: #22c55e; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 30px; font-size: 40px; color: white;">✓</div>
                <div style="font-weight: 950; font-size: 28px; color: #0f172a;">Pembayaran Berhasil</div>
                <div style="font-size: 14px; font-weight: 700; color: #64748b; margin: 8px 0 30px;">E-Ticket dan konfirmasi telah dikirim ke email Anda.</div>
                <div style="background: #0f172a; color: white; padding: 16px; border-radius: 12px; font-weight: 950; font-size: 14px; letter-spacing: 0.1em;">LIHAT E-TICKET</div>
            </div>
        </div>
    </div>
</body>
</html>
