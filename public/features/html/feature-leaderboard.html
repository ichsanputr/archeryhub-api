<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 1000px; height: 1000px;
            background-color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            overflow: hidden; position: relative;
            display: flex; flex-direction: column;
            padding: 60px;
            background-image: 
                linear-gradient(#e2e8f0 1px, transparent 1px),
                linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
            background-size: 40px 40px;
        }
        
        /* App Layout Mockups */
        .app-container {
            width: 100%; height: 100%;
            background: white; border-radius: 40px;
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.1);
            overflow: hidden; border: 12px solid #0f172a;
            position: relative; display: flex; flex-direction: column;
        }
        .status-bar {
            height: 44px; padding: 0 30px; display: flex; justify-content: space-between; align-items: center;
            font-weight: 700; font-size: 14px; color: #0f172a;
        }
        .nav-bar {
            height: 70px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #f1f5f9;
        }
        
        /* Bracket Layout */
        .bracket-canvas {
            flex: 1; display: flex; padding: 40px; gap: 40px; align-items: center;
            background: #f8fafc;
        }
        .round { display: flex; flex-direction: column; gap: 60px; flex: 1; align-items: center;}
        
        /* Match Node Design (Based on App UI) */
        .match-node {
            width: 240px; background: white; border-radius: 20px; border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow: hidden;
        }
        .match-header {
            padding: 8px 16px; background: #f8fafc; border-bottom: 1px solid #f1f5f9;
            display: flex; justify-content: space-between; align-items: center;
        }
        .match-badge {
            font-size: 8px; font-weight: 900; padding: 2px 8px; border-radius: 6px;
            text-transform: uppercase;
        }
        .badge-green { background: #dcfce7; color: #15803d; }
        .badge-amber { background: #fef3c7; color: #b45309; }
        
        .archer-row {
            padding: 12px 16px; display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid #f8fafc;
        }
        .archer-row.is-winner { background: #fee2e2; } /* Primary/10 */
        .archer-row:last-child { border-bottom: none; }
        
        .avatar {
            width: 32px; height: 32px; border-radius: 8px; background: #e2e8f0;
            position: relative; border: 1px solid #f1f5f9; overflow: hidden;
        }
        .score { margin-left: auto; font-weight: 950; font-size: 16px; color: #0f172a; }
        .winner-score { color: #D91629; font-size: 20px; }
        .name { font-size: 12px; font-weight: 950; color: #0f172a; flex: 1; }
        
        /* Connector SVGs */
        .connect-svg { position: absolute; pointer-events: none; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- iOS Style Status Bar -->
        <div class="status-bar">
            <span>9:41</span>
            <div style="display: flex; gap: 6px;">
                <div style="width: 18px; height: 10px; border: 1px solid #0f172a; border-radius: 2px;"></div>
                <div style="width: 12px; height: 12px; border: 2px solid #0f172a; border-radius: 50%;"></div>
            </div>
        </div>
        
        <!-- Header -->
        <div class="nav-bar">
            <div style="width: 32px; height: 32px; background: #f1f5f9; border-radius: 50%;"></div>
            <div style="font-weight: 950; font-size: 16px; color: #0f172a;">HASIL ELIMINASI</div>
            <div style="width: 32px; height: 32px; background: #f1f5f9; border-radius: 50%;"></div>
        </div>

        <!-- Section Title in Page -->
        <div style="padding: 24px 30px 10px;">
            <div style="font-weight: 950; font-size: 24px; color: #0f172a;">Recurve Men Open</div>
            <div style="font-size: 12px; color: #64748b; font-weight: 700;">Brawijaya Traditional Open 2026</div>
        </div>

        <div class="bracket-canvas">
            <!-- Semifinals -->
            <div class="round">
                <div style="text-align: center; font-size: 10px; font-weight: 950; color: #94a3b8; margin-bottom: -40px;">SEMI FINAL</div>
                
                <div class="match-node">
                    <div class="match-header">
                        <span class="match-badge badge-green">SELESAI</span>
                        <span style="font-size: 9px; color: #94a3b8; font-weight: 700;">TARGET 15A</span>
                    </div>
                    <div class="archer-row is-winner">
                        <div class="avatar"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" /></div>
                        <span class="name">A. SANTOSO</span>
                        <span class="score winner-score">6</span>
                    </div>
                    <div class="archer-row" style="opacity: 0.5;">
                        <div class="avatar"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Budi" /></div>
                        <span class="name">B. WIJAYA</span>
                        <span class="score">4</span>
                    </div>
                </div>

                <div class="match-node">
                    <div class="match-header">
                        <span class="match-badge badge-green">SELESAI</span>
                        <span style="font-size: 9px; color: #94a3b8; font-weight: 700;">TARGET 16B</span>
                    </div>
                    <div class="archer-row" style="opacity: 0.5;">
                        <div class="avatar"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Raka" /></div>
                        <span class="name">R. HIDAYAT</span>
                        <span class="score">0</span>
                    </div>
                    <div class="archer-row is-winner">
                        <div class="avatar"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Fajar" /></div>
                        <span class="name">M. FAJAR</span>
                        <span class="score winner-score">6</span>
                    </div>
                </div>
            </div>

            <!-- Connectors (Simplified) -->
            <div style="width: 40px; height: 350px; position: relative; display: flex; align-items: center; justify-content: center;">
                 <svg width="40" height="300" viewBox="0 0 40 300" fill="none">
                    <path d="M0 50 H20 V250 H0 M20 150 H40" stroke="#cbd5e1" stroke-width="2"/>
                 </svg>
            </div>

            <!-- Final -->
            <div class="round">
                <div style="text-align: center; color: #ef4444; font-size: 11px; font-weight: 950; margin-bottom: -40px; display: flex; align-items: center; gap: 4px;">
                    <div style="width: 6px; height: 6px; background: #ef4444; border-radius: 50%; animate: pulse 2s infinite;"></div>
                    GOLD MATCH
                </div>
                
                <div class="match-node" style="border: 2px solid #ef4444; box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.2);">
                    <div class="match-header" style="background: #fef2f2;">
                        <span class="match-badge badge-amber" style="background: #ef4444; color: white;">LIVE</span>
                        <span style="font-size: 9px; color: #ef4444; font-weight: 950;">FINAL</span>
                    </div>
                    <div class="archer-row">
                        <div class="avatar"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" /></div>
                        <span class="name">A. SANTOSO</span>
                        <span class="score">4</span>
                    </div>
                    <div class="archer-row">
                        <div class="avatar"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Fajar" /></div>
                        <span class="name">M. FAJAR</span>
                        <span class="score">2</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Floating Action Button Mockup -->
        <div style="position: absolute; bottom: 30px; right: 30px; width: 60px; height: 60px; background: #0f172a; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; font-weight: 100;">
            +
        </div>
    </div>
</body>
</html>
