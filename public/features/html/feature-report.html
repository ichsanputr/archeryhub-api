<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 1000px; height: 1000px; background-color: #f8fafc;
            font-family: 'Outfit', sans-serif; overflow: hidden; position: relative;
            display: flex; flex-direction: column; padding: 60px;
            background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .app-container {
            width: 100%; height: 100%;
            background: white; border-radius: 40px; border: 12px solid #0f172a;
            position: relative; display: flex; flex-direction: column; overflow: hidden;
        }
        .status-bar { height: 44px; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; color: #0f172a; }
        .stat-card { background: #f8fafc; border-radius: 20px; border: 1px solid #e2e8f0; padding: 24px; }
        .bar { width: 30px; border-radius: 6px; background: #ef4444; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="status-bar"><span>9:41</span><div style="display: flex; gap: 6px;"><div style="width: 18px; height: 10px; border: 1px solid #0f172a; border-radius: 2px;"></div></div></div>
        
        <div style="padding: 40px 30px;">
            <div style="font-weight: 950; font-size: 32px; color: #0f172a; margin-bottom: 8px;">Statistik Performa</div>
            <div style="font-size: 14px; font-weight: 700; color: #64748b;">Recurve Men Open - 70m</div>
            
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 40px;">
                <div class="stat-card">
                    <div style="font-size: 12px; font-weight: 950; color: #64748b;">RATA-RATA SKOR</div>
                    <div style="font-size: 36px; font-weight: 950; color: #0f172a; margin: 4px 0;">9.42</div>
                    <div style="font-size: 10px; font-weight: 950; color: #22c55e;">+0.12 dari sesi lalu</div>
                </div>
                <div class="stat-card">
                    <div style="font-size: 12px; font-weight: 950; color: #64748b;">TOTAL X/10</div>
                    <div style="font-size: 36px; font-weight: 950; color: #0f172a; margin: 4px 0;">64%</div>
                    <div style="font-size: 10px; font-weight: 950; color: #ef4444;">-2% dari sesi lalu</div>
                </div>
            </div>

            <div class="stat-card" style="margin-top: 30px;">
                 <div style="font-size: 12px; font-weight: 950; color: #94a3b8; margin-bottom: 30px;">PROGRESS SKOR (6 SESI TERAKHIR)</div>
                 <div style="display: flex; align-items: flex-end; justify-content: space-between; height: 200px; padding: 0 10px;">
                    <div class="bar" style="height: 60%; opacity: 0.3;"></div>
                    <div class="bar" style="height: 75%; opacity: 0.4;"></div>
                    <div class="bar" style="height: 45%; opacity: 0.2;"></div>
                    <div class="bar" style="height: 90%; opacity: 0.6;"></div>
                    <div class="bar" style="height: 85%; opacity: 0.8;"></div>
                    <div class="bar" style="height: 100%; background: #0f172a;"></div>
                 </div>
                 <div style="display: flex; justify-content: space-between; margin-top: 15px; font-size: 10px; font-weight: 950; color: #cbd5e1;">
                    <span>S1</span><span>S2</span><span>S3</span><span>S4</span><span>S5</span><span style="color: #0f172a;">TODAY</span>
                 </div>
            </div>
            
            <div style="margin-top: 40px; background: #0f172a; color: white; padding: 20px; border-radius: 20px; display: flex; align-items: center; justify-content: space-between;">
                <div>
                    <div style="font-size: 11px; font-weight: 950; opacity: 0.6; letter-spacing: 0.1em;">REPORT LENGKAP (.PDF)</div>
                    <div style="font-size: 16px; font-weight: 950;">Generated at 29 Mar 2026</div>
                </div>
                <div style="width: 44px; height: 44px; background: rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px;">⬇</div>
            </div>
        </div>
    </div>
</body>
</html>
