<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 1000px; height: 1000px; background-color: #f8fafc;
            font-family: 'Outfit', sans-serif; overflow: hidden; position: relative;
            display: flex; flex-direction: column; padding: 60px;
            background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .app-container {
            width: 100%; height: 100%;
            background: white; border-radius: 40px; border: 12px solid #0f172a;
            position: relative; display: flex; flex-direction: column; overflow: hidden;
        }
        .status-bar { height: 44px; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; color: #0f172a; }
        .profile-header { background: #0f172a; padding: 40px 30px; color: white; border-radius: 0 0 40px 40px; }
        .stat-box { background: white; padding: 20px; border-radius: 16px; border: 1px solid #f1f5f9; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="status-bar" style="color: white; position: absolute; width: 100%; z-index: 20;"><span>9:41</span><div style="display: flex; gap: 6px;"><div style="width: 18px; height: 10px; border: 1px solid white; border-radius: 2px;"></div></div></div>
        
        <div class="profile-header">
            <div style="display: flex; align-items: center; gap: 24px; margin-top: 20px;">
                <div style="width: 90px; height: 90px; border-radius: 24px; border: 4px solid #ef4444; background: white; overflow: hidden;">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" />
                </div>
                <div>
                    <div style="font-weight: 950; font-size: 28px; line-height: 1;">Budi Santoso</div>
                    <div style="font-size: 14px; font-weight: 700; color: #64748b; margin: 6px 0 12px;">@budis_archer</div>
                    <div style="display: flex; gap: 8px;">
                        <span style="background: #ef4444; color: white; padding: 4px 12px; border-radius: 6px; font-size: 10px; font-weight: 950;">ELITE CHAMPION</span>
                        <span style="background: rgba(255,255,255,0.1); color: white; padding: 4px 12px; border-radius: 6px; font-size: 10px; font-weight: 950;">LVL 42</span>
                    </div>
                </div>
            </div>
        </div>

        <div style="padding: 40px 24px;">
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: -80px;">
                <div class="stat-box">
                    <div style="font-weight: 950; font-size: 24px; color: #0f172a;">126</div>
                    <div style="font-size: 10px; font-weight: 950; color: #94a3b8; margin-top: 4px;">EVENT</div>
                </div>
                <div class="stat-box">
                    <div style="font-weight: 950; font-size: 24px; color: #0f172a;">15</div>
                    <div style="font-size: 10px; font-weight: 950; color: #94a3b8; margin-top: 4px;">MEDALI</div>
                </div>
                <div class="stat-box">
                    <div style="font-weight: 950; font-size: 24px; color: #0f172a;">720</div>
                    <div style="font-size: 10px; font-weight: 950; color: #94a3b8; margin-top: 4px;">TOP SKOR</div>
                </div>
            </div>

            <div style="margin-top: 40px;">
                <div style="font-weight: 950; font-size: 18px; color: #0f172a; margin-bottom: 20px;">Review Sertifikat</div>
                <div style="display: flex; gap: 16px;">
                    <div style="width: 140px; height: 100px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
                        <div style="font-size: 24px;">📄</div>
                        <div style="font-size: 10px; font-weight: 700; color: #94a3b8;">KUALIFIKASI.PDF</div>
                    </div>
                    <div style="width: 140px; height: 100px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
                        <div style="font-size: 24px;">📄</div>
                        <div style="font-size: 10px; font-weight: 700; color: #94a3b8;">PIALA_PRES.PDF</div>
                    </div>
                </div>
            </div>
            
            <div style="margin-top: auto; padding-top: 50px;">
                <div style="height: 60px; background: #0f172a; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 950; font-size: 14px; letter-spacing: 0.1em;">EDIT PROFIL DIGITAL</div>
            </div>
        </div>
    </div>
</body>
</html>
