<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 1000px; height: 1000px; background-color: #f8fafc;
            font-family: 'Outfit', sans-serif; overflow: hidden; position: relative;
            display: flex; flex-direction: column; padding: 60px;
            background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .app-container {
            width: 100%; height: 100%;
            background: #0f172a; border-radius: 40px; border: 12px solid #0f172a;
            position: relative; display: flex; flex-direction: column; overflow: hidden;
        }
        .status-bar { height: 44px; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; color: white; }
        .nav-bar { height: 70px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .key-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; height: 100px; display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: 900; color: white; transition: all 0.2s;
        }
        .key-btn:active { background: #ef4444; color: white; }
        .score-pill { background: rgba(255,255,255,0.05); padding: 8px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; align-items: center; min-width: 60px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="status-bar"><span>9:41</span><div style="display: flex; gap: 6px;"><div style="width: 18px; height: 10px; border: 1px solid white; border-radius: 2px;"></div></div></div>
        <div class="nav-bar text-white">
            <div style="font-weight: 950; font-size: 20px;">Scoring Digital</div>
            <div style="font-size: 12px; font-weight: 950; color: #ef4444;">LIVE</div>
        </div>
        
        <!-- Score Display Page -->
        <div style="padding: 30px; flex: 1; display: flex; flex-direction: column;">
            <div style="background: rgba(255,255,255,0.03); border-radius: 24px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: auto;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                    <div>
                        <div style="font-size: 10px; font-weight: 950; color: #64748b; text-transform: uppercase;">Seri ke-3 // Atlet 1</div>
                        <div style="font-size: 24px; font-weight: 950; color: white;">Budi Santoso</div>
                    </div>
                    <div style="font-size: 64px; font-weight: 950; color: #ef4444;">29</div>
                </div>
                
                <div style="display: flex; gap: 12px; justify-content: center;">
                    <div class="score-pill"><span style="font-size: 10px; opacity: 0.5;">ARROW 1</span><span style="font-size: 24px; font-weight: 950; color: #fbbf24;">X</span></div>
                    <div class="score-pill"><span style="font-size: 10px; opacity: 0.5;">ARROW 2</span><span style="font-size: 24px; font-weight: 950; color: #fbbf24;">10</span></div>
                    <div class="score-pill" style="border: 2px solid #ef4444;"><span style="font-size: 10px; color: #ef4444;">ARROW 3</span><span style="font-size: 24px; font-weight: 950; color: #ef4444;">9</span></div>
                </div>
            </div>

            <!-- Keypad Mockup -->
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding-bottom: 20px;">
                <div class="key-btn" style="background: #fbbf24; color: #0f172a;">X</div>
                <div class="key-btn" style="background: #fbbf24; color: #0f172a;">10</div>
                <div class="key-btn" style="background: #ef4444;">9</div>
                <div class="key-btn">8</div>
                <div class="key-btn">7</div>
                <div class="key-btn" style="background: #64748b;">M</div>
            </div>
        </div>
    </div>
</body>
</html>
